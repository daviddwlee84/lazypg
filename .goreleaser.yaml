version: 2
project_name: lazypg
before:
  hooks:
    - python3 scripts/release.py completions --project lazypg --binary lazypg --main ./cmd/lazypg
builds:
  - id: lazypg
    main: ./cmd/lazypg
    binary: lazypg
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-buildvcs=true, -trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/daviddwlee84/lazypg/internal/cli.Version=v{{ .Version }}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
      - src: completions/*
checksum:
  name_template: checksums.txt
release:
  draft: true
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
